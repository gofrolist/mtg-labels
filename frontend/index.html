<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <meta
      name="description"
      content="Generate printable Avery label sheets for your Magic: The Gathering collection. Select sets, customize templates, and download ready-to-print PDFs."
    />
    <link rel="preconnect" href="https://mtg-labels.fly.dev" crossorigin />
    <link rel="dns-prefetch" href="https://mtg-labels.fly.dev" />
    <title>MTG Label Generator</title>
    <script>
      // Prefetch API data while JS bundles load (production only)
      if (location.hostname !== 'localhost') {
        window.__prefetch = {
          sets: fetch('https://mtg-labels.fly.dev/api/sets')
            .then(function (r) {
              return r.ok ? r.json() : null
            })
            .catch(function () {
              return null
            }),
          setIcons: fetch('https://mtg-labels.fly.dev/api/set-icons')
            .then(function (r) {
              return r.ok ? r.json() : null
            })
            .catch(function () {
              return null
            }),
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
