name: Backend Deploy
on:
  workflow_run:
    workflows: ["Backend Build"]
    types: [completed]
    branches: [ main ]
  push:
    tags: [ 'v*' ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

permissions:
  contents: read
  packages: read

defaults:
  run:
    working-directory: backend

concurrency:
  group: backend-deploy
  cancel-in-progress: true

jobs:
  fly-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Install Flyctl
      uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1

    - name: Determine image tag
      id: meta
      env:
        WF_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        if [ -n "$WF_SHA" ]; then
          echo "sha=$WF_SHA" >> "$GITHUB_OUTPUT"
        else
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Deploy to Fly
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: |
        flyctl deploy --image ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.sha }}
