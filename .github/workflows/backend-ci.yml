name: Backend CI
on:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-build.yml'
      - '.github/workflows/backend-deploy.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'push' || steps.filter.outputs.backend == 'true' }}
      docker: ${{ github.event_name == 'push' || steps.filter.outputs.docker == 'true' }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/backend-build.yml'
              - '.github/workflows/backend-deploy.yml'
            docker:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - '.github/workflows/backend-ci.yml'

  test:
    name: tests & lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version-file: backend/.python-version

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev pkg-config

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Sync deps
      run: uv sync --all-extras

    - name: Ruff lint
      run: uv run ruff check .

    - name: Ruff format (check)
      run: uv run ruff format --check .

    - name: Pyright
      run: uv run pyright

    - name: Dependency vulnerability scan (pip-audit)
      run: uv run --with pip-audit pip-audit

    - name: Static security scan (bandit)
      run: uv run --with bandit bandit -q -r src

    - name: Pytest
      run: uv run pytest -q --cov --cov-report=term-missing

  docker-build:
    name: docker build & smoke
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Build image (load locally, no push)
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: ./backend
        load: true
        tags: mtg-labels:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test (boot, healthcheck, non-root, render libs)
      run: |
        set -euo pipefail
        docker run -d --name mtg-ci mtg-labels:ci
        # Wait for the image's own HEALTHCHECK to report healthy: proves the app
        # boots and serves a local 200 (catches a base bump that breaks startup).
        for _ in $(seq 1 30); do
          hstat="$(docker inspect -f '{{.State.Health.Status}}' mtg-ci 2>/dev/null || echo starting)"
          echo "health: $hstat"
          [ "$hstat" = "healthy" ] && break
          [ "$hstat" = "unhealthy" ] && { docker logs mtg-ci; exit 1; }
          sleep 2
        done
        [ "$(docker inspect -f '{{.State.Health.Status}}' mtg-ci)" = "healthy" ] || { docker logs mtg-ci; exit 1; }
        # Must run as the unprivileged user baked into the image.
        [ "$(docker exec mtg-ci id -u)" = "1000" ] || { echo "expected uid 1000"; exit 1; }
        # The PDF render path's shared libs must resolve against the runtime base
        # (a broken Alpine/cairo bump would fail here, not silently at deploy time).
        docker exec mtg-ci python -c "import cairosvg, reportlab, svglib, fastapi; print('render libs OK')"
        docker rm -f mtg-ci
