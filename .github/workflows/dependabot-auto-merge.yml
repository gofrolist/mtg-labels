name: Dependabot auto-merge

on:
  # Arm auto-merge when Dependabot opens/updates a PR.
  pull_request_target:
  # Re-arm auto-merge after CI finishes. GitHub disables auto-merge whenever a
  # required check fails; the pull_request_target trigger only fires on
  # push/open/reopen, so without this a one-time transient failure would leave
  # an eligible PR stuck open forever. workflow_run is used (not check_suite,
  # which GitHub suppresses for Actions-created suites to prevent recursion) so
  # this reliably fires when the CI workflows complete.
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Initial arming: approve + enable auto-merge for eligible Dependabot PRs.
  # Excludes semver-major bumps; docker minor/patch are allowed (only docker
  # majors are gated, via the same semver-major check).
  arm:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

  # Re-arming: when a CI workflow finishes successfully, re-enable auto-merge on
  # any open Dependabot PR the arm job already approved (approval == eligible,
  # so semver-major bumps — never approved — are never re-armed). Idempotent:
  # PRs that already have auto-merge enabled are skipped. Native auto-merge still
  # gates the actual merge on ALL required checks, so re-arming after a single
  # workflow's success is safe.
  rearm:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable auto-merge on eligible Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # PRs associated with the completed run (populated for same-repo
          # branches, which Dependabot uses); fall back to a head-branch lookup.
          prs=$(jq -r '.workflow_run.pull_requests[].number' "$GITHUB_EVENT_PATH")
          if [ -z "$prs" ]; then
            prs=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
              --json number --jq '.[].number')
          fi
          for pr in $(echo "$prs" | sort -u); do
            [ -n "$pr" ] || continue
            data=$(gh pr view "$pr" --repo "$REPO" \
              --json state,author,autoMergeRequest,reviews 2>/dev/null) || continue
            state=$(jq -r '.state' <<<"$data")
            author=$(jq -r '.author.login' <<<"$data")
            has_automerge=$(jq -r 'if .autoMergeRequest == null then "no" else "yes" end' <<<"$data")
            approved=$(jq -r '[.reviews[] | select(.state == "APPROVED")] | length' <<<"$data")
            if [ "$state" = "OPEN" ] && [ "$author" = "dependabot[bot]" ] \
               && [ "$has_automerge" = "no" ] && [ "$approved" -gt 0 ]; then
              echo "Re-arming auto-merge on #$pr"
              gh pr merge --auto --squash "$pr" --repo "$REPO" || true
            else
              echo "Skipping #$pr (state=$state author=$author automerge=$has_automerge approved=$approved)"
            fi
          done
