[project]
name = "mtg-labels"
version = "0.1.0"
description = "A Magic: The Gathering Printable Label Generator using FastAPI, ReportLab, and Bootstrap 5."
authors = [
    {name = "Evgenii Vasilenko", email = "vasilenko.e@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "requests>=2.34.2",
    "reportlab>=5.0.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.32",
    "cairosvg>=2.7.1",
    "svglib>=2.1.0",
    "cachetools>=7.1.7",
    "pypdf>=6.14.2",
    "defusedxml>=0.7.1",
    "starlette>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.24.0",
    "pytest-mock>=3.11.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "ruff>=0.16.1",
    "pyright>=1.1.411",
    "pre-commit>=4.6.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
    "performance: Performance tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
